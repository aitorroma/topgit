<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FF4B4B">
  <meta name="description" content="Instala TOP GIT para compartir repositorios desde Android.">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/app-icon.svg" type="image/svg+xml">
  <title>Instalar TOP GIT</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font-family: system-ui, sans-serif; background: #f8fafc; color: #1e293b; }
    main { width: min(100%, 460px); background: white; border-radius: 20px; padding: 30px; text-align: center; box-shadow: 0 14px 44px rgba(15, 23, 42, .12); }
    img { width: 92px; height: 92px; border-radius: 18px; object-fit: contain; }
    h1 { margin: 18px 0 10px; }
    p { color: #64748b; line-height: 1.55; }
    button, a { display: inline-flex; align-items: center; justify-content: center; min-height: 46px; padding: 0 18px; border-radius: 10px; font-weight: 700; text-decoration: none; }
    button { border: 0; background: #FF4B4B; color: white; cursor: pointer; }
    button[hidden] { display: none; }
    a { color: #FF4B4B; }
    #message { font-size: .95rem; }
  </style>
</head>
<body>
  <main>
    <img src="/app-icon.svg" alt="TOP GIT">
    <h1>Compartir en TOP GIT</h1>
    <p>Instala esta aplicación web y TOP GIT aparecerá como destino en el menú Compartir de Android.</p>
    <button id="install" type="button" hidden>Instalar TOP GIT</button>
    <p id="message">Preparando instalación…</p>
    <a href="/">Volver a TOP GIT</a>
  </main>

  <script>
    const installButton = document.getElementById('install');
    const message = document.getElementById('message');
    let deferredPrompt;

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/service-worker.js').catch(console.error);
    }

    window.addEventListener('beforeinstallprompt', event => {
      event.preventDefault();
      deferredPrompt = event;
      installButton.hidden = false;
      message.textContent = 'Pulsa el botón para instalarla.';
    });

    installButton.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const choice = await deferredPrompt.userChoice;
      deferredPrompt = null;
      installButton.hidden = true;
      message.textContent = choice.outcome === 'accepted'
        ? 'TOP GIT se ha instalado. Ya puedes usarlo desde Compartir.'
        : 'Instalación cancelada.';
    });

    window.addEventListener('appinstalled', () => {
      installButton.hidden = true;
      message.textContent = 'TOP GIT está instalado. Ya aparecerá en el menú Compartir.';
    });

    setTimeout(() => {
      if (!deferredPrompt && !window.matchMedia('(display-mode: standalone)').matches) {
        message.textContent = 'En Chrome, abre el menú ⋮ y pulsa “Instalar aplicación” si no aparece el botón.';
      }
    }, 1500);
  </script>
</body>
</html>
