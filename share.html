<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FF4B4B">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/topgit.jpg" type="image/jpeg">
  <title>Enviar a TOP GIT</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font-family: system-ui, sans-serif; background: #f8fafc; color: #1e293b; }
    main { width: min(100%, 420px); background: #fff; border-radius: 18px; padding: 28px; text-align: center; box-shadow: 0 12px 40px rgba(15, 23, 42, .12); }
    img { width: 72px; height: 72px; border-radius: 14px; object-fit: cover; }
    h1 { margin: 18px 0 10px; font-size: 1.45rem; }
    p { margin: 0; color: #64748b; overflow-wrap: anywhere; }
    button { margin-top: 22px; border: 0; border-radius: 10px; padding: 12px 18px; background: #FF4B4B; color: white; font-weight: 700; cursor: pointer; }
    button[hidden] { display: none; }
  </style>
</head>
<body>
  <main>
    <img src="/topgit.jpg" alt="TOP GIT">
    <h1 id="status">Enviando a TOP GIT…</h1>
    <p id="detail">Procesando el enlace compartido.</p>
    <button id="retry" type="button" hidden>Reintentar</button>
  </main>

  <script>
    const WEBHOOK_URL = 'https://api.nimbox360.com/webhook/7b0ebcde-5847-484b-98ad-5b78cc2c10a3';
    const params = new URLSearchParams(location.search);
    const statusEl = document.getElementById('status');
    const detailEl = document.getElementById('detail');
    const retryButton = document.getElementById('retry');

    function extractRepositoryUrl() {
      const values = [params.get('url'), params.get('text'), params.get('title')].filter(Boolean);
      const combined = values.join(' ');
      const match = combined.match(/https:\/\/(?:github\.com|gitlab\.com)\/[\w-]+\/[\w.-]+\/?/i);
      return match ? match[0].replace(/[),.;!?]+$/, '') : '';
    }

    async function submit() {
      const repositoryUrl = extractRepositoryUrl();
      retryButton.hidden = true;

      if (!repositoryUrl) {
        statusEl.textContent = 'Enlace no válido';
        detailEl.textContent = 'Solo se aceptan repositorios de GitHub o GitLab.';
        return;
      }

      statusEl.textContent = 'Enviando a TOP GIT…';
      detailEl.textContent = repositoryUrl;

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 30000);

      try {
        const response = await fetch(WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: repositoryUrl }),
          signal: controller.signal
        });

        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const result = await response.json();
        if (result.result === 'added') {
          statusEl.textContent = 'Añadido a TOP GIT';
          detailEl.textContent = repositoryUrl;
        } else if (result.result === 'exist') {
          statusEl.textContent = 'Ya estaba en TOP GIT';
          detailEl.textContent = repositoryUrl;
        } else {
          throw new Error('Respuesta inesperada');
        }
      } catch (error) {
        statusEl.textContent = error.name === 'AbortError' ? 'Tiempo de espera agotado' : 'No se pudo enviar';
        detailEl.textContent = 'Comprueba la conexión y vuelve a intentarlo.';
        retryButton.hidden = false;
      } finally {
        clearTimeout(timeoutId);
      }
    }

    retryButton.addEventListener('click', submit);
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/service-worker.js');
    submit();
  </script>
</body>
</html>
